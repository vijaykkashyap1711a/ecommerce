apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product
          image: REPLACE_WITH_ECR_PRODUCT_IMAGE
          ports:
            - containerPort: 5001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: PRODUCT_DATABASE_URL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: API_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: ecommerce
spec:
  selector:
    app: product
  ports:
    - port: 5001
      targetPort: 5001