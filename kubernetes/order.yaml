apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: REPLACE_WITH_ECR_ORDER_IMAGE
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: ORDER_DATABASE_URL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: API_TOKEN
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: PRODUCT_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce
spec:
  selector:
    app: order
  ports:
    - port: 5003
      targetPort: 5003