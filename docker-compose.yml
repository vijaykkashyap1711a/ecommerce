services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  product:
    build:
      context: .
      args:
        SERVICE_DIR: product_services
    environment:
      PORT: 5001
      DATABASE_URL: postgresql+psycopg2://app:${POSTGRES_PASSWORD}@postgres:5432/ecommerce_product_db
      API_TOKEN: ${API_TOKEN}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  order:
    build:
      context: .
      args:
        SERVICE_DIR: order_service
    environment:
      PORT: 5003
      DATABASE_URL: postgresql+psycopg2://app:${POSTGRES_PASSWORD}@postgres:5432/ecommerce_order_db
      PRODUCT_SERVICE_URL: http://product:5001
      API_TOKEN: ${API_TOKEN}
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      product:
        condition: service_started

  frontend:
    build:
      context: .
      args:
        SERVICE_DIR: front_end
    environment:
      PORT: 5500
    ports:
      - "5500:5500"
    depends_on:
      - product
      - order

volumes:
  postgres_data: